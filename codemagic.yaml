workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate android project
        script: flutter create --platforms=android --org com.ffsensai .
      - name: Add permissions
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" "$MANIFEST" || sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          grep -q "SYSTEM_ALERT_WINDOW" "$MANIFEST" || sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>' "$MANIFEST"
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
