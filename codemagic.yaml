workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate android project
        script: flutter create --platforms=android --org com.ffsensai .
      - name: Add permissions
        script: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          def ensure(c, name):
              if name in c:
                  return c
              line = '    <uses-permission android:name="android.permission.' + name + '"/>\n'
              return re.sub(r'(<manifest[^>]*>)', r'\1\n' + line, c, count=1)
          content = ensure(content, "INTERNET")
          content = ensure(content, "SYSTEM_ALERT_WINDOW")
          with open(path, "w") as f:
              f.write(content)
          PYEOF
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
